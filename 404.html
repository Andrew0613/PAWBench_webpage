<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#123f35">
    <title>Page not found — PAWBench</title>
  </head>
  <body>
    <main class="not-found">
      <p class="eyebrow">404 <span aria-hidden="true">·</span> Future not observed</p>
      <h1>That outcome is outside this page's support.</h1>
      <p>The address may be incorrect, or the requested resource may not be public yet.</p>
      <a href="/PAWBench_webpage/">Return to PAWBench</a>
    </main>
    <style>
      :root {
        --navy: #163653;
        --ivory: #f7f2df;
        --mint: #e2f2fb;
        --sage: #9dbed8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.65;
      }

      a {
        color: inherit;
        text-underline-offset: 0.18em;
      }

      :focus-visible {
        outline: 3px solid #e0ad5c;
        outline-offset: 4px;
      }

      .eyebrow {
        margin: 0;
        font-size: 0.72rem;
        font-weight: 780;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .not-found {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100vh;
        padding: clamp(2rem, 8vw, 8rem);
        color: var(--ivory);
        background: var(--navy);
      }

      .not-found .eyebrow { color: var(--sage); }

      .not-found h1 {
        max-width: 14ch;
        margin: 1.25rem 0 1.5rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3rem, 8vw, 7rem);
        font-weight: 500;
        line-height: 0.98;
        letter-spacing: -0.048em;
      }

      .not-found p:not(.eyebrow) {
        max-width: 50ch;
        color: var(--mint);
      }

      .not-found a {
        width: fit-content;
        margin-top: 1rem;
        font-weight: 800;
      }
    </style>
  </body>
</html>
